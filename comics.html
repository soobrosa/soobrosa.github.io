<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comic &amp; Book Covers</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e6e8ee;
    --muted: #9aa3b2;
    --accent: #4f8cff;
    --tile: 140px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 1500px; margin: 0 auto; padding: 28px 20px 60px; }
  header h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: .2px; }
  header p { margin: 0; color: var(--muted); }
  .stats { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 22px; }
  .stat { background: var(--panel); border: 1px solid var(--border);
          border-radius: 10px; padding: 10px 14px; min-width: 110px; }
  .stat .num { font-size: 20px; font-weight: 600; }
  .stat .lbl { color: var(--muted); font-size: 12px; }
  .controls { background: var(--panel); border: 1px solid var(--border);
              border-radius: 12px; padding: 16px; margin-bottom: 18px;
              display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  input[type=search], select {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 11px; font-size: 14px; outline: none; max-width: 340px;
  }
  input[type=search] { min-width: 240px; }
  input[type=search]:focus, select:focus { border-color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--panel-2); border: 1px solid var(--border);
          color: var(--muted); border-radius: 999px; padding: 6px 12px;
          cursor: pointer; font-size: 13px; user-select: none; transition: .12s; }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .grow { flex: 1; }
  .note { color: #e8c84a; font-size: 11px; }
  .countline { color: var(--muted); margin: 0 2px 16px; font-size: 13px; }

  /* Humble only serves a 70x70 source image and its imgix URLs are signature-
     locked, so no larger render can be requested; these tiles are a 2x upscale. */
  .tile { width: var(--tile); flex: 0 0 var(--tile); }
  .thumb { position: relative; width: var(--tile); height: var(--tile);
           background: var(--panel-2); border: 1px solid var(--border);
           border-radius: 8px; overflow: hidden;
           display: flex; align-items: center; justify-content: center; }
  .tile:hover .thumb { border-color: var(--accent); }
  .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .thumb .ph { color: var(--muted); font-size: 11px; text-align: center; padding: 8px; }
  .tile .t { font-size: 11.5px; line-height: 1.32; color: var(--muted); margin-top: 6px;
             display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
             overflow: hidden; word-break: break-word; }
  .tile:hover .t { color: var(--text); }
  .tile .t.n { font-size: 13px; font-weight: 600; color: var(--text);
               font-variant-numeric: tabular-nums; }
  .dot { position: absolute; top: 5px; right: 5px; width: 8px; height: 8px;
         border-radius: 50%; box-shadow: 0 0 0 2px rgba(15,17,21,.9); }
  .dot.comic { background: #f0934a; }
  .dot.book { background: #4f8cff; }
  .dot.artbook { background: #9ad84f; }

  /* Series view: one wrapping row of issues per series. */
  .series { margin-bottom: 26px; }
  .series h2 { font-size: 14px; margin: 0 0 4px; font-weight: 600; }
  .series .sub { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 14px 12px; }
  .sechead { font-size: 12px; text-transform: uppercase; letter-spacing: .5px;
             color: var(--muted); border-top: 1px solid var(--border);
             padding-top: 16px; margin: 30px 0 14px; }
  .grid { display: flex; flex-wrap: wrap; gap: 16px 12px; }

  /* List view */
  .list .tile { display: flex; flex-direction: row; align-items: center; gap: 14px;
                width: auto; flex: none; padding: 8px;
                border-bottom: 1px solid var(--border); }
  .list .tile:hover { background: var(--panel); }
  .list .thumb { flex: 0 0 var(--tile); }
  .list .body { min-width: 0; flex: 1; }
  .list .t { font-size: 13.5px; color: var(--text); margin-top: 0; -webkit-line-clamp: 2; }
  /* Bundle/format line is list-view only; the display override must be explicit
     because the base rule below sets `display`, which specificity alone won't undo. */
  .list .b { display: block; color: var(--muted); font-size: 11.5px; margin-top: 4px;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .b { display: none; }
  .list .row, .list .grid { display: block; }

  .empty { text-align: center; padding: 50px; color: var(--muted); }
  .more { display: block; margin: 24px auto 0; background: var(--panel-2); color: var(--text);
          border: 1px solid var(--border); border-radius: 8px; padding: 10px 18px;
          font-size: 14px; cursor: pointer; }
  .more:hover { border-color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Comic &amp; Book Covers</h1>
    <p id="subtitle"></p>
  </header>

  <div class="stats" id="stats"></div>

  <div class="controls">
    <div class="field grow">
      <label for="q">Search title</label>
      <input id="q" type="search" placeholder="Type to filter by title…" autocomplete="off">
    </div>
    <div class="field">
      <label>Type</label>
      <div class="chips" id="typeChips"></div>
    </div>
    <div class="field">
      <label for="bundle">Bundle</label>
      <select id="bundle"></select>
      <span class="note" id="bundleNote" hidden>reset — no items of that type</span>
    </div>
    <div class="field">
      <label>Covers</label>
      <div class="chips"><div class="chip" id="withCover">Has cover only</div></div>
    </div>
    <div class="field">
      <label>View</label>
      <div class="chips">
        <div class="chip on" id="viewSeries">Series rows</div>
        <div class="chip" id="viewFlat">Flat grid</div>
        <div class="chip" id="viewList">List</div>
      </div>
    </div>
  </div>

  <p class="countline" id="countline"></p>
  <div id="out"></div>
  <button class="more" id="more" hidden>Show more</button>
  <div class="empty" id="empty" hidden>Nothing matches those filters.</div>
</div>

ng?auto=compress,format&s=0b065f53dc4b4085e5cea5f9bea5a1b6","formats":["PDF"],"series":"​Free Issue Twilight Zone","skey":"freeissuetwilightzone","num":1,"grouped":false},{"title":"​Free Issue Uncanny #1","type":"comic","bundle":"Humble Dynamite MEGA Holidays Bundle","icon":"https://hb.imgix.net/3c1f756820429d9db59a4b437556f93d302281f1.png?auto=compress,format&s=34ec95c1b8345a08963a58f63b14a5b6","formats":["PDF"],"series":"​Free Issue Uncanny","skey":"freeissueuncanny","num":1,"grouped":false},{"title":"​No Starch Sampler","type":"book","bundle":"Humble Brainiac Book Bundle Presented by No Starch Press","icon":"https://hb.imgix.net/058f47f93ddf0941718962880a8b44b56d5c79a5.png?auto=compress,format&s=c7bbf5d2e89a2ccb11689c85837a655a","formats":["PDF (HQ)"],"series":"​No Starch Sampler","skey":"nostarchsampler","num":null,"grouped":true},{"title":"​Wayward #1","type":"comic","bundle":"Humble Image Comics Bundle 2: Image Firsts","icon":"https://hb.imgix.net/74a1438d2260cf994d56d6f7282822bf65288b8e.png?auto=compress,format&s=34d7e35769bc93221094e683b80c19be","formats":["PDF"],"series":"​Wayward","skey":"wayward","num":1,"grouped":false},{"title":"“The Dark Nothing,” in Uptight #5","type":"comic","bundle":"Humble Comics Bundle: Eisner Nominees 2017 Showcase","icon":"https://hb.imgix.net/622b4a366b2678f0ed118250bb2fec6b20dd927f.png?auto=compress,format&s=e60b4c641fee0b5e0dd16e9cdfe35d96","formats":["CBZ","PDF"],"series":"“The Dark Nothing,” in Uptight","skey":"thedarknothinginuptight","num":5,"grouped":false}];
const PAGE = 300;

const el = id => document.getElementById(id);
const esc = s => (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
                          .replace(/>/g, '&gt;').replace(/"/g, '&quot;');

let activeTypes = new Set();
let coverOnly = false;
let view = 'series';
let shown = PAGE;

function bundleCounts(rows) {
  const c = new Map();
  for (const r of rows) if (r.bundle) c.set(r.bundle, (c.get(r.bundle) || 0) + 1);
  return [...c.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}

/* Rows passing every filter except the bundle one, i.e. the facet the bundle
   dropdown should describe. The search box is deliberately excluded: rebuilding
   and possibly resetting the select on each keystroke would fight the user. */
function facetRows() {
  return DATA.filter(r => {
    if (activeTypes.size && !activeTypes.has(r.type)) return false;
    if (coverOnly && !r.icon) return false;
    return true;
  });
}

/* Repopulate the dropdown from the current facet, keeping the selection when it
   still has items and falling back to "All bundles" when it no longer does, so
   a type change can never strand the user on an empty result. */
function refreshBundles() {
  const sel = el('bundle');
  const prev = sel.value;
  const rows = facetRows();
  const counts = bundleCounts(rows);
  sel.innerHTML = `<option value="">All bundles (${rows.length})</option>` +
    counts.map(([b, n]) => `<option value="${esc(b)}">${esc(b)} (${n})</option>`).join('');
  sel.value = counts.some(([b]) => b === prev) ? prev : '';
  el('bundleNote').hidden = !(prev && sel.value !== prev);
}

function filtered() {
  const q = el('q').value.trim().toLowerCase();
  const b = el('bundle').value;
  return DATA.filter(r => {
    if (activeTypes.size && !activeTypes.has(r.type)) return false;
    if (b && r.bundle !== b) return false;
    if (coverOnly && !r.icon) return false;
    if (q && !r.title.toLowerCase().includes(q)) return false;
    return true;
  });
}

function tile(r, label) {
  const img = r.icon
    ? `<img loading="lazy" src="${esc(r.icon)}" alt=""
            onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:'no art'}))">`
    : `<div class="ph">no art</div>`;
  const fmt = r.formats.length ? ` &middot; ${esc(r.formats.join(', '))}` : '';
  const isNum = label !== null;
  const text = isNum ? `#${label}` : esc(r.title);
  return `<div class="tile" title="${esc(r.title + (r.bundle ? '\n' + r.bundle : ''))}">
    <div class="thumb"><span class="dot ${r.type}"></span>${img}</div>
    <div class="body">
      <div class="t${isNum ? ' n' : ''}">${text}</div>
      <div class="b">${esc(r.bundle) || '—'}${fmt}</div>
    </div>
  </div>`;
}

function renderSeries(rows) {
  const map = new Map();
  const singles = [];
  for (const r of rows) {
    if (!r.grouped) { singles.push(r); continue; }
    if (!map.has(r.skey)) map.set(r.skey, []);
    map.get(r.skey).push(r);
  }
  // A filter can strip a series down to one surviving member; show those as
  // standalone rather than as a one-tile "series".
  const series = [];
  for (const items of map.values()) {
    if (items.length > 1) series.push(items); else singles.push(items[0]);
  }
  series.sort((a, b) => a[0].series.toLowerCase().localeCompare(b[0].series.toLowerCase()));
  singles.sort((a, b) => a.title.toLowerCase().localeCompare(b.title.toLowerCase()));

  let budget = shown;
  const html = [];
  let rendered = 0;
  for (const items of series) {
    if (budget <= 0) break;
    const s = items[0].series;
    const withNum = items.filter(i => i.num !== null).length;
    html.push(`<div class="series">
      <h2>${esc(s)}</h2>
      <p class="sub">${items.length} items${withNum === items.length ? '' : ' (some unnumbered)'}
        &middot; ${esc(items[0].bundle)}</p>
      <div class="row">${items.map(i => tile(i, i.num)).join('')}</div>
    </div>`);
    budget -= items.length; rendered += items.length;
  }
  if (budget > 0 && singles.length) {
    const page = singles.slice(0, budget);
    html.push(`<div class="sechead">Standalone (${singles.length})</div>
               <div class="grid">${page.map(r => tile(r, null)).join('')}</div>`);
    rendered += page.length;
  }
  return {html: html.join(''), rendered,
          seriesCount: series.length, singleCount: singles.length};
}

function render() {
  const rows = filtered();
  el('empty').hidden = rows.length > 0;

  if (view === 'series') {
    const r = renderSeries(rows);
    el('out').className = '';
    el('out').innerHTML = r.html;
    el('more').hidden = r.rendered >= rows.length;
    el('countline').textContent =
      `${r.seriesCount} series and ${r.singleCount} standalone items` +
      ` — showing ${r.rendered} of ${rows.length}` +
      (rows.length !== DATA.length ? ` (filtered from ${DATA.length})` : '');
    return;
  }

  const page = rows.slice(0, shown);
  el('out').className = view === 'list' ? 'list' : '';
  el('out').innerHTML =
    `<div class="${view === 'list' ? 'row' : 'grid'}">${page.map(r => tile(r, null)).join('')}</div>`;
  el('more').hidden = rows.length <= shown;
  el('countline').textContent =
    `Showing ${page.length} of ${rows.length} items` +
    (rows.length !== DATA.length ? ` (filtered from ${DATA.length})` : '');
}

function buildControls() {
  const types = [...new Set(DATA.map(r => r.type))].sort();
  el('typeChips').innerHTML = types
    .map(t => `<div class="chip" data-t="${esc(t)}">${esc(t)}</div>`).join('');
  el('typeChips').querySelectorAll('.chip').forEach(ch => {
    ch.onclick = () => {
      const t = ch.dataset.t;
      if (activeTypes.has(t)) { activeTypes.delete(t); ch.classList.remove('on'); }
      else { activeTypes.add(t); ch.classList.add('on'); }
      refreshBundles();
      shown = PAGE; render();
    };
  });

  refreshBundles();
  el('bundle').onchange = () => { el('bundleNote').hidden = true; shown = PAGE; render(); };

  el('withCover').onclick = () => {
    coverOnly = !coverOnly;
    el('withCover').classList.toggle('on', coverOnly);
    refreshBundles();
    shown = PAGE; render();
  };

  const setView = v => {
    view = v;
    for (const [id, name] of [['viewSeries','series'], ['viewFlat','flat'], ['viewList','list']])
      el(id).classList.toggle('on', view === name);
    shown = PAGE; render();
  };
  el('viewSeries').onclick = () => setView('series');
  el('viewFlat').onclick = () => setView('flat');
  el('viewList').onclick = () => setView('list');

  el('q').oninput = () => { shown = PAGE; render(); };
  el('more').onclick = () => { shown += PAGE; render(); };
}

function boot() {
  const withCover = DATA.filter(r => r.icon).length;
  const counts = {};
  for (const r of DATA) counts[r.type] = (counts[r.type] || 0) + 1;
  const seriesKeys = new Set(DATA.filter(r => r.grouped).map(r => r.skey));
  el('subtitle').textContent =
    `${DATA.length} items from your Humble library, ${withCover} with cover art. ` +
    `Humble's source images are 70x70, shown here upscaled to 140.`;
  const cells = Object.entries(counts).sort((a, b) => b[1] - a[1])
    .map(([t, n]) => `<div class="stat"><div class="num">${n}</div><div class="lbl">${t}</div></div>`);
  cells.push(`<div class="stat"><div class="num">${seriesKeys.size}</div><div class="lbl">series</div></div>`);
  cells.push(`<div class="stat"><div class="num">${withCover}</div><div class="lbl">with cover</div></div>`);
  cells.push(`<div class="stat"><div class="num">${bundleCounts(DATA).length}</div><div class="lbl">bundles</div></div>`);
  el('stats').innerHTML = cells.join('');
  buildControls();
  render();
}

boot();
</script>
